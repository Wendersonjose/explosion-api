name: CI - Testes Automatizados

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Executar Testes
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout código
      uses: actions/checkout@v3

    - name: Configurar Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Instalar dependências
      run: npm ci

    - name: Executar linter (se configurado)
      run: npm run lint --if-present
      continue-on-error: true

    - name: Executar testes unitários
      run: npm test

    - name: Executar testes com cobertura
      run: npm run test:coverage

    - name: Upload cobertura para Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage/lcov.info
        flags: unittests
        name: codecov-explosion-api
      continue-on-error: true

    - name: Verificar limites de cobertura
      run: |
        echo "Verificando cobertura mínima de 70%"
        # O Jest já valida automaticamente pelos thresholds configurados

    - name: Comentar PR com resultado dos testes
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '✅ Todos os testes passaram com sucesso!'
          })
      continue-on-error: true

  quality-check:
    name: Verificação de Qualidade
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout código
      uses: actions/checkout@v3

    - name: Configurar Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18.x
        cache: 'npm'

    - name: Instalar dependências
      run: npm ci

    - name: Verificar vulnerabilidades
      run: npm audit --audit-level=moderate
      continue-on-error: true

    - name: Verificar dependências desatualizadas
      run: npm outdated
      continue-on-error: true

  notify:
    name: Notificar Resultado
    runs-on: ubuntu-latest
    needs: [test, quality-check]
    if: always()

    steps:
    - name: Resultado Final
      run: |
        if [ "${{ needs.test.result }}" == "success" ] && [ "${{ needs.quality-check.result }}" == "success" ]; then
          echo "✅ Pipeline executado com sucesso!"
        else
          echo "❌ Pipeline falhou. Verifique os logs acima."
          exit 1
        fi
